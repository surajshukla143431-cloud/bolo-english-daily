<style>
/* Layout concept: one-column practice studio. Accent-filled "riyaaz" hero on Today, quiet surfaces elsewhere.
   Bottom tab bar on phones, inline tabs on desktop. Chat shows each learner line with its correction card beneath. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface2:#E8ECE6; --ink:#121A16; --ink2:#4A574F; --line:#D5DBD2;
  --accent:#2B4BEA; --accent-ink:#FFFFFF; --accent-soft:#E3E8FE;
  --warm:#C98400; --warm-soft:#FBEFCF;
  --good:#17803D; --good-soft:#DDF3E4; --bad:#C23B2E; --bad-soft:#FBE4E1;
  --font-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --navh:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161E19; --surface2:#1E2822; --ink:#E9EFEA; --ink2:#9BAA9F; --line:#2A362E;
  --accent:#8CA2FF; --accent-ink:#0B1030; --accent-soft:#1C2548;
  --warm:#F2B84A; --warm-soft:#33280F;
  --good:#58C77F; --good-soft:#15301E; --bad:#FF8A7D; --bad-soft:#3A1A17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E19; --surface2:#1E2822; --ink:#E9EFEA; --ink2:#9BAA9F; --line:#2A362E;
  --accent:#8CA2FF; --accent-ink:#0B1030; --accent-soft:#1C2548;
  --warm:#F2B84A; --warm-soft:#33280F;
  --good:#58C77F; --good-soft:#15301E; --bad:#FF8A7D; --bad-soft:#3A1A17; color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);margin:0;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(var(--navh) + env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--font-mono)}
.muted{color:var(--ink2)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.ico{display:inline-flex;width:20px;height:20px;flex:none}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font:800 26px/1 var(--font-display);letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--ink2);font-weight:600}
.chips{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill.streak{color:var(--warm);background:var(--warm-soft);border-color:transparent}
.pill .ico{width:16px;height:16px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:600;color:var(--ink2);min-height:48px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
@media (min-width:820px){
  :root{--navh:0px}
  body{padding-block:22px 56px}
  .nav{position:static;order:2;display:flex;justify-content:flex-start;background:none;border:0;padding:0;gap:6px}
  .nav button{flex-direction:row;gap:8px;padding:8px 14px;font-size:14px;min-height:0}
  .shell{display:flex}
  .top{order:1}
  main{order:3}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn.on{background:var(--bad);color:#fff;border-color:transparent;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.icon-btn.on{animation:none}}
.back{align-self:flex-start;border:0;background:none;display:inline-flex;gap:6px;align-items:center;color:var(--ink2);font-weight:700;padding:6px 0;min-height:44px}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip-btn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;min-height:36px}
.chip-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(30px,8vw,44px);font-weight:800}
.hero .eyebrow{color:inherit;opacity:.8}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.segs i{height:8px;border-radius:4px;background:currentColor;opacity:.28}
.segs i.on{opacity:1}
.hero .meta{display:flex;justify-content:space-between;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.task .tic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.task.done .tic{background:var(--good-soft);color:var(--good)}
.task b{display:block;font-weight:700}
.task small{display:block;color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.task .txt{min-width:0}
.task .xp{font:600 12px var(--font-mono);color:var(--ink2);text-align:right}
.task.done .xp{color:var(--good)}

/* composer */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.ta{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;min-height:44px;max-height:180px}
.cnote{font-size:13px;color:var(--ink2);min-height:18px;padding:0 4px}
.sticky-comp{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 8px);z-index:5}
@media (min-width:820px){.sticky-comp{bottom:12px}}

/* word / task cards */
.bigword{font:800 clamp(34px,9vw,52px)/1 var(--font-display)}
.say{font-family:var(--font-mono);font-size:15px;color:var(--accent)}
.sent{font:600 clamp(20px,5vw,26px)/1.3 var(--font-display)}
.words{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:20px;font-weight:600}
.words span{padding:2px 8px;border-radius:8px}
.words .ok{background:var(--good-soft);color:var(--good)}
.words .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.clock{font:700 46px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.clock.over{color:var(--bad)}
.tip{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink2)}

/* feedback */
.fb{display:flex;flex-direction:column;gap:10px}
.verdict{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--warm-soft);color:var(--warm)}
.fixed{background:var(--good-soft);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.fixed p{font-weight:600}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.mist{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.mist .w{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.mist .r{color:var(--good);font-weight:700}
.mist .why{font-size:14px;color:var(--ink2)}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.scores{grid-template-columns:repeat(4,1fr)}}
.score{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.score b{font:800 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.score b small{font-size:14px;color:var(--ink2);font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* chat */
.chatlist{display:flex;flex-direction:column;gap:12px}
.b{max-width:88%;padding:10px 14px;border-radius:18px;display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere}
.b.coach{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.b.me{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px;align-self:flex-end}
.b .ico{width:18px;height:18px}
.b button.spk{border:0;background:none;color:var(--accent);padding:2px;margin-top:2px;min-width:28px;min-height:28px}
.corr{align-self:flex-end;width:min(100%,92%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.corr .perfect{color:var(--good);font-weight:700}
.dots{display:inline-flex;gap:4px;padding:6px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink2);opacity:.5;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.notice{background:var(--warm-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}

/* notebook */
.nb{display:flex;flex-direction:column;gap:8px}
.nbi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.nbi.mastered{opacity:.6}
.nbi .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.flash{align-items:stretch;text-align:left;gap:14px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font:800 30px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar .col{width:100%;max-width:36px;border-radius:8px 8px 3px 3px;background:var(--accent);min-height:4px}
.bar .col.zero{background:var(--line)}
.bar small{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px;color:var(--ink2)}
.badge.on{border-style:solid;border-color:transparent;background:var(--accent-soft);color:var(--ink)}
.badge b{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.set{display:flex;flex-direction:column;gap:6px}
pre.prompt{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:12px;padding:12px;font:13px/1.5 var(--font-mono);margin:0;max-height:260px;overflow:auto}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

#toast{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 76px);display:flex;justify-content:center;pointer-events:none;z-index:50;padding:0 16px}
#toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
[hidden]{display:none!important}
html{color-scheme:light dark}
</style>

const WORDS=[

const API_URL='https://api.anthropic.com/v1/messages';

const MODELS=()=>({quick:(S.modelQuick||'').trim()||'claude-haiku-5-5',main:(S.modelMain||'').trim()||'claude-sonnet-5-5'});
function mergeTurns(turns){const out=[];for(const t of turns){if(out.length&&out[out.length-1].role===t.role) out[out.length-1].content+='\n\n'+t.content;else out.push({role:t.role,content:t.content});}return out;}
async function callClaude(input,o){
  const key=getKey();if(!key) throw {code:'no_key'};
  const messages=mergeTurns(typeof input==='string'?[{role:'user',content:input}]:input);
  const body={model:MODELS()[o.tier==='quick'?'quick':'main'],max_tokens:o.max||1024,messages,stream:!!o.onText};
  let res;
  try{res=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});}
  catch(e){throw {code:'offline'};}
  if(!res.ok){throw {code:(res.status===401||res.status===403)?'bad_key':res.status===429?'rate_limited':res.status===404?'bad_model':res.status===402?'no_credit':'upstream_error',status:res.status};}
  if(!o.onText){const j=await res.json();return (j.content||[]).map(c=>c.text||'').join('');}
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='',text='';
  for(;;){
    const {done,value}=await reader.read();if(done) break;
    buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const ln of lines){
      if(!ln.startsWith('data:')) continue;const d=ln.slice(5).trim();if(!d) continue;
      try{const ev=JSON.parse(d);if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;o.onText({text,delta:ev.delta.text});}}catch(e){}
    }
  }
  if(!text.trim()) throw {code:'upstream_error'};
  return text;
}

function addXP(n){

  if(S.lastDay!==k){const y=dkey(new Date(Date.now()-864e5));S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=k;S.best=Math.max(S.best||0,S.streak);}

function addMistakes(list){

    const wrong=String(m.wrong||'').trim(),right=String(m.right||'').trim();
    if(!wrong||!right||wrong.toLowerCase()===right.toLowerCase()) continue;

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function makeMic(ta,note){
  let rec=null,on=false,base='',heard=false;
  const btn=h('button',{class:'icon-btn',type:'button','aria-label':'Mic se bolo','aria-pressed':'false'},icon('mic'));
  const api={el:btn,used:false};
  function setOn(v){on=v;btn.classList.toggle('on',v);btn.setAttribute('aria-pressed',String(v));}
  api.stop=function(){try{rec&&rec.stop();}catch(e){}setOn(false);};
  api.start=function(){
    if(on) return;
    if(!SR){note('Is browser mein mic typing nahi hai. Apne keyboard ka mic (voice typing) dabakar bolein.');ta.focus();return;}
    try{
      rec=new SR();rec.lang=S.accent;rec.interimResults=true;rec.continuous=true;heard=false;
      base=ta.value.trim()?ta.value.trim()+' ':'';
      rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;heard=true;api.used=true;ta.value=base+t.trim();ta.dispatchEvent(new Event('input'));};
      rec.onerror=e=>{setOn(false);
        if(e.error==='not-allowed'||e.error==='service-not-allowed') note('Is page mein mic block hai. Keyboard ke mic (voice typing) se bolein, text yahin likh jayega.');
        else if(e.error==='no-speech') note('Kuch sunai nahi diya. Dobara try karein.');
        else if(e.error!=='aborted') note('Mic error: '+e.error);};
      rec.onend=()=>{setOn(false);if(heard) note('Bol diya. Text check karke bhejein.');};
      rec.start();setOn(true);note('Sun raha hoon... ab bolein.');
    }catch(e){setOn(false);note('Mic start nahi hua. Keyboard ke mic se bolein.');}
  };
  btn.addEventListener('click',()=>on?api.stop():api.start());
  return api;
}
function composer(o){
  const ta=h('textarea',{class:'ta',id:'ta-'+o.id,rows:o.rows||2,placeholder:o.placeholder,'aria-label':o.placeholder,autocomplete:'off',autocapitalize:'sentences',spellcheck:'false'});

  send.addEventListener('click',doSend);

  const el=h('div',{class:'composer'+(o.sticky?' sticky-comp':'')},h('div',{class:'line'},ta,mic.el,send),noteEl);

}

function parseTutor(t){
  const out={fixed:'',mistakes:'',better:'',tip:'',reply:''};
  const re=/(^|\n)[ \t]*\**(FIXED|MISTAKES|BETTER|TIP|REPLY)\**[ \t]*:/g;let m;const idx=[];
  while((m=re.exec(t))) idx.push({k:m[2].toLowerCase(),s:m.index,e:re.lastIndex});
  idx.forEach((x,i)=>{out[x.k]=t.slice(x.e,i+1<idx.length?idx[i+1].s:t.length).trim();});
  if(!idx.length) out.reply=t.trim();
  return out;
}
function parseMist(str){
  const res=[];
  for(let line of String(str||'').split('\n')){
    line=line.replace(/^[\s\-•*]+/,'').trim();if(!line) continue;
    const parts=line.split(/=>|→|->/);if(parts.length<2) continue;
    const rest=parts.slice(1).join(' ').split('|');
    res.push({wrong:parts[0].trim().replace(/^["“]|["”]$/g,''),right:rest[0].trim().replace(/^["“]|["”]$/g,''),why:(rest[1]||'').trim()});
  }
  return res.slice(0,4);
}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
function compare(target,said){
  const T=target.split(/\s+/).filter(Boolean),cnt={};
  norm(said).split(' ').filter(Boolean).forEach(w=>{cnt[w]=(cnt[w]||0)+1;});
  const res=T.map(w=>{const k=norm(w).replace(/'/g,"'");if(cnt[k]>0){cnt[k]--;return {w,ok:true};}return {w,ok:false};});
  return {res,acc:Math.round(100*res.filter(r=>r.ok).length/T.length)};
}

function countFillers(t){const m=t.toLowerCase().match(/\b(um+|uh+|erm+|hmm+|you know|i mean|basically|actually|like)\b/g);return m?m.length:0;}

        Array.isArray(r.better_phrases)&&r.better_phrases.length?h('div',{},h('div',{class:'lbl'},'Ye phrases try karo'),h('ul',{},r.better_phrases.slice(0,3).map(p=>h('li',{},String(p))))):null,
        r.next_goal?h('p',{},h('b',{},'Kal ka goal: '),String(r.next_goal)):null));
      dayRec(dkey()).secs+=Math.round(elapsed||60);save();

/* ---------- Tutor ---------- */
const chat={sid:null,items:[],userCount:0};
function resetChat(sid){chat.sid=sid;chat.items=[];chat.userCount=0;}
function rulesText(sc){
  return 'You are "Coach", a warm, patient spoken-English coach for a Hindi-speaking learner in India. '+lvlNote()+'\nScenario: '+sc.desc+'. Stay in that role while chatting.\n'+ctx()+
  '\nEvery message after this one is the learner\'s spoken sentence. Reply using EXACTLY these labels, each starting on a new line, in this order, with nothing before FIXED:\n'+
  'FIXED: the learner\'s message corrected into natural English, one line. Write only OK if it was already correct.\n'+
  'MISTAKES: up to 3 lines, each formatted as "- wrong part => corrected part | short reason in '+expl()+'". Write a single "-" if none.\n'+
  'BETTER: one more natural, native-sounding way to say the same thing, or "-".\n'+
  'TIP: one short tip in '+expl()+' (max 15 words), or "-".\n'+
  'REPLY: your reply as the conversation partner, 1-3 short sentences, ending with ONE follow-up question.\n'+
  'No markdown, no extra text. Your opening line was already: "'+sc.open+'"';
}
function buildTurns(sc,newText){
  const done=chat.items.filter(i=>i.done).slice(-6);const t=[{role:'user',content:rulesText(sc)}];
  done.forEach(i=>{t.push({role:'user',content:i.u});t.push({role:'assistant',content:i.raw});});
  t.push({role:'user',content:newText});return t;
}
function pairNodes(item){
  const me=h('div',{class:'b me'},item.u);
  const corr=h('div',{class:'corr'});
  const coachBody=h('div',{});
  const coach=h('div',{class:'b coach'},coachBody);
  function refresh(){
    const p=parseTutor(item.raw);
    const kids=[];
    const fx=p.fixed.trim();
    if(!fx){kids.push(h('div',{class:'dots'},h('i'),h('i'),h('i')));}
    else if(/^ok\b/i.test(fx)){kids.push(h('div',{class:'perfect'},'Bilkul sahi! Ek dum natural sentence.'));}
    else{kids.push(h('div',{class:'fixed'},h('div',{},h('div',{class:'lbl'},'Aise bolo'),h('p',{},fx)),speakBtn(fx)));}
    const ms=parseMist(p.mistakes);ms.forEach(m=>kids.push(mistNode(m)));
    if(p.better&&p.better!=='-') kids.push(h('p',{},h('span',{class:'lbl'},'Aur natural: '),p.better));
    if(p.tip&&p.tip!=='-') kids.push(h('p',{class:'muted'},p.tip));
    corr.replaceChildren(...kids);
    if(p.reply){coachBody.replaceChildren(h('span',{},p.reply));if(item.done&&!coach.querySelector('.spk')) coach.append(h('button',{class:'spk',type:'button','aria-label':'Reply suno',onclick:()=>speak(p.reply)},icon('speaker')));}
    else coachBody.replaceChildren(h('div',{class:'dots'},h('i'),h('i'),h('i')));
  }
  refresh();
  return {nodes:[me,corr,coach],refresh,remove(){[me,corr,coach].forEach(n=>n.remove());}};
}
function viewTutor(){

  let busy=false;
  const comp=composer({id:'chat',rows:2,sticky:true,enterSends:true,placeholder:'Kuch bhi bolo ya likho...',hint:'Mic dabao ya keyboard ke voice typing se bolo. Hindi words aaye toh bhi chalega.',onSend:async(text,c)=>{
